<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc">
  <title id="title">Bagian-bagian JWT</title>
  <desc id="desc">JWT terdiri dari header, payload, dan signature. Header memilih HS256, payload memuat subject, role, waktu terbit, dan expiry yang dapat dibaca, signature dibuat memakai secret dan melindungi integritas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#142239"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8296b5" stroke-opacity=".1"/></pattern>
    <clipPath id="canvas"><rect width="1120" height="370" rx="28"/></clipPath>
    <style>
      text{font-family:Inter,"Segoe UI",sans-serif}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#8fa4c5}.title{font-size:26px;font-weight:750;letter-spacing:-.4px;fill:#f4f7ff}.card{fill:#121e30;stroke:#30435f;stroke-width:1.3}.blue{fill:#16243a;stroke:#405a82}.teal{fill:#142b2d;stroke:#347f75}.amber{fill:#2b241e;stroke:#926438}.label{font-size:18px;font-weight:700;fill:#f1f5fc}.sub{font-size:14px;fill:#afbdd2}.minor{font-size:13px;fill:#9fb1c9}
    </style>
  </defs>
  <rect width="1120" height="370" rx="28" fill="url(#bg)"/><g clip-path="url(#canvas)"><rect width="1120" height="370" fill="url(#grid)" opacity=".3"/><circle cx="1080" cy="15" r="175" fill="#5071ab" opacity=".08"/></g>
  <rect x="42" y="29" width="26" height="4" rx="2" fill="#61d2bd"/><text x="80" y="36" class="eyebrow">BENTUK TOKEN</text>
  <text x="42" y="82" class="title">Tiga bagian, satu tanda tangan</text>
  <g text-anchor="middle">
    <rect x="52" y="119" width="300" height="112" rx="18" class="blue"/><circle cx="82" cy="149" r="5" fill="#82a8e8"/><text x="202" y="158" class="label">Header</text><text x="202" y="190" class="sub">algoritma: HS256</text><text x="202" y="212" class="minor">cara token ditandatangani</text>
    <text x="372" y="184" font-size="28" font-weight="700" fill="#7186a7">.</text>
    <rect x="390" y="119" width="340" height="112" rx="18" class="teal"/><circle cx="420" cy="149" r="5" fill="#5ed1ba"/><text x="560" y="158" class="label">Payload</text><text x="560" y="190" class="sub">sub · role · iat · exp</text><text x="560" y="212" class="minor">isi dapat dibaca, bukan dienkripsi</text>
    <text x="750" y="184" font-size="28" font-weight="700" fill="#7186a7">.</text>
    <rect x="768" y="119" width="300" height="112" rx="18" class="amber"/><circle cx="798" cy="149" r="5" fill="#f2b86d"/><text x="918" y="158" class="label">Signature</text><text x="918" y="190" class="sub">dibuat dengan secret server</text><text x="918" y="212" class="minor">mendeteksi perubahan token</text>
  </g>
  <rect x="230" y="258" width="660" height="42" rx="13" fill="#101a2a" stroke="#30435f"/><text x="560" y="285" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#dbe5f3">header.payload.signature</text>
  <text x="560" y="337" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#aebed4">Jangan taruh password atau secret di payload. Signature menjaga integritas, bukan enkripsi.</text>
</svg>
