<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" role="img" aria-labelledby="title desc">
  <title id="title">Dari Cargo manifest ke server</title>
  <desc id="desc">Cargo membaca manifest, membangun crate, membuat executable, lalu cargo run menjalankan aplikasi dengan konfigurasi dan database.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#142239"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8296b5" stroke-opacity=".1"/></pattern>
    <clipPath id="canvas"><rect width="1120" height="340" rx="28"/></clipPath>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#8299ba"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",sans-serif}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#8fa4c5}.title{font-size:26px;font-weight:750;letter-spacing:-.4px;fill:#f4f7ff}.card{fill:#121e30;stroke:#30435f;stroke-width:1.3}.blue{fill:#16243a;stroke:#405a82}.teal{fill:#142b2d;stroke:#347f75}.label{font-size:17px;font-weight:700;fill:#f1f5fc}.sub{font-size:13px;fill:#afbdd2}.line{fill:none;stroke:#8299ba;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="340" rx="28" fill="url(#bg)"/><g clip-path="url(#canvas)"><rect width="1120" height="340" fill="url(#grid)" opacity=".3"/><circle cx="1080" cy="15" r="175" fill="#5071ab" opacity=".08"/></g>
  <rect x="42" y="29" width="26" height="4" rx="2" fill="#61d2bd"/><text x="80" y="36" class="eyebrow">DARI KODE MENJADI SERVER</text>
  <text x="42" y="82" class="title">Cargo mengatur build; aplikasi yang memulai layanan</text>
  <path d="M284 184h24M549 184h24M814 184h24" class="line"/>
  <g text-anchor="middle">
    <rect x="42" y="130" width="242" height="108" rx="18" class="card"/><circle cx="73" cy="160" r="15" fill="#293a55"/><text x="73" y="165" font-size="12" font-weight="700" fill="#d8e4f6">01</text><text x="163" y="176" class="label">Cargo.toml</text><text x="163" y="207" class="sub">daftar dependency</text>
    <rect x="307" y="130" width="242" height="108" rx="18" class="card"/><circle cx="338" cy="160" r="15" fill="#293a55"/><text x="338" y="165" font-size="12" font-weight="700" fill="#d8e4f6">02</text><text x="428" y="176" class="label">cargo build</text><text x="428" y="207" class="sub">kompilasi kode</text>
    <rect x="572" y="130" width="242" height="108" rx="18" class="blue"/><circle cx="603" cy="160" r="15" fill="#2b3e5c"/><text x="603" y="165" font-size="12" font-weight="700" fill="#d8e4f6">03</text><text x="693" y="176" class="label">cargo run</text><text x="693" y="207" class="sub">jalankan main.rs</text>
    <rect x="837" y="130" width="242" height="108" rx="18" class="teal"/><circle cx="868" cy="160" r="15" fill="#1e4a46"/><text x="868" y="165" font-size="12" font-weight="700" fill="#c6f4e9">04</text><text x="958" y="176" class="label">API aktif</text><text x="958" y="207" class="sub">localhost:8080</text>
  </g>
  <text x="560" y="294" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#aebed4">cargo run membangun bila perlu, lalu menjalankan server dengan konfigurasi aplikasi</text>
</svg>
