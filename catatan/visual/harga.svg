<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 320" role="img" aria-labelledby="title desc">
  <title id="title">Transformasi harga</title>
  <desc id="desc">Harga disimpan sebagai Decimal dan diubah menjadi teks Rupiah hanya pada beberapa response GET menu.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#142239"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8296b5" stroke-opacity=".1"/></pattern>
    <clipPath id="canvas"><rect width="1120" height="320" rx="28"/></clipPath>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#8299ba"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",sans-serif}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#8fa4c5}.title{font-size:26px;font-weight:750;letter-spacing:-.4px;fill:#f4f7ff}.card{fill:#121e30;stroke:#30435f;stroke-width:1.3}.teal{fill:#142b2d;stroke:#347f75}.amber{fill:#2b241e;stroke:#926438}.label{font-size:18px;font-weight:700;fill:#f1f5fc}.sub{font-size:14px;fill:#afbdd2}.line{fill:none;stroke:#8299ba;stroke-width:2.4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="320" rx="28" fill="url(#bg)"/><g clip-path="url(#canvas)"><rect width="1120" height="320" fill="url(#grid)" opacity=".3"/><circle cx="1080" cy="15" r="175" fill="#5071ab" opacity=".08"/></g>
  <rect x="42" y="29" width="26" height="4" rx="2" fill="#61d2bd"/><text x="80" y="36" class="eyebrow">ANGKA → TAMPILAN</text>
  <text x="42" y="82" class="title">Nilai tetap numerik sampai perlu ditampilkan</text>
  <path d="M356 181h42M678 181h42" class="line"/>
  <g text-anchor="middle">
    <rect x="66" y="126" width="290" height="108" rx="18" class="card"/><circle cx="98" cy="158" r="16" fill="#293a55"/><text x="98" y="163" font-size="12" font-weight="700" fill="#d8e4f6">01</text><text x="211" y="175" class="label">Decimal</text><text x="211" y="207" class="sub">25000 · nilai numerik</text>
    <rect x="398" y="126" width="280" height="108" rx="18" class="teal"/><circle cx="430" cy="158" r="16" fill="#1e4a46"/><text x="430" y="163" font-size="12" font-weight="700" fill="#c6f4e9">02</text><text x="538" y="175" class="label" font-size="16">format_rupiah()</text><text x="538" y="207" class="sub">kelompok ribuan + koma</text>
    <rect x="720" y="126" width="300" height="108" rx="18" class="amber"/><circle cx="752" cy="158" r="16" fill="#503a27"/><text x="752" y="163" font-size="12" font-weight="700" fill="#ffe0b4">03</text><text x="870" y="175" class="label">String</text><text x="870" y="207" class="sub">Rp25.000</text>
  </g>
  <text x="560" y="279" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#aebed4">Formatter hanya mengubah tampilan; data PostgreSQL tetap NUMERIC.</text>
</svg>
