<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">Siklus CRUD pada handler</title>
  <desc id="desc">Input request dibaca dan divalidasi, SQL dijalankan, hasilnya bercabang menjadi data ditemukan, data tidak ada, atau error; handler mengembalikan status dan JSON.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#142239"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8296b5" stroke-opacity=".1"/></pattern>
    <clipPath id="canvas"><rect width="1120" height="360" rx="28"/></clipPath>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#8299ba"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",sans-serif}.eyebrow{font-size:13px;font-weight:700;letter-spacing:2px;fill:#8fa4c5}.title{font-size:26px;font-weight:750;letter-spacing:-.4px;fill:#f4f7ff}.card{fill:#121e30;stroke:#30435f;stroke-width:1.3}.blue{fill:#16243a;stroke:#405a82}.teal{fill:#142b2d;stroke:#347f75}.amber{fill:#2b241e;stroke:#926438}.label{font-size:17px;font-weight:700;fill:#f1f5fc}.sub{font-size:13px;fill:#afbdd2}.line{fill:none;stroke:#8299ba;stroke-width:2.4;marker-end:url(#arrow)}.note{font-size:13px;fill:#c3cfe0}
    </style>
  </defs>
  <rect width="1120" height="360" rx="28" fill="url(#bg)"/><g clip-path="url(#canvas)"><rect width="1120" height="360" fill="url(#grid)" opacity=".3"/><circle cx="1040" cy="25" r="180" fill="#5071ab" opacity=".08"/></g>
  <rect x="42" y="29" width="26" height="4" rx="2" fill="#61d2bd"/><text x="80" y="36" class="eyebrow">POLA HANDLER</text>
  <text x="42" y="82" class="title">Setiap operasi melewati empat tahap</text>
  <path d="M274 181h18M539 181h18M804 181h18" class="line"/>
  <g text-anchor="middle">
    <rect x="42" y="126" width="230" height="110" rx="18" class="card"/><circle cx="72" cy="156" r="15" fill="#2a3d59"/><text x="72" y="161" font-size="12" font-weight="700" fill="#d9e5f8">01</text><text x="157" y="171" class="label">Terima input</text><text x="157" y="201" class="sub">JSON · ID · query</text>
    <rect x="307" y="126" width="230" height="110" rx="18" class="amber"/><circle cx="337" cy="156" r="15" fill="#503a27"/><text x="337" y="161" font-size="12" font-weight="700" fill="#ffe0b4">02</text><text x="422" y="171" class="label">Validasi</text><text x="422" y="201" class="sub">400 bila tidak sah</text>
    <rect x="572" y="126" width="230" height="110" rx="18" class="teal"/><circle cx="602" cy="156" r="15" fill="#1e4a46"/><text x="602" y="161" font-size="12" font-weight="700" fill="#c6f4e9">03</text><text x="687" y="171" class="label">Jalankan SQL</text><text x="687" y="201" class="sub">bind · fetch · execute</text>
    <rect x="837" y="126" width="230" height="110" rx="18" class="blue"/><circle cx="867" cy="156" r="15" fill="#2a3d59"/><text x="867" y="161" font-size="12" font-weight="700" fill="#d9e5f8">04</text><text x="952" y="171" class="label">Bentuk response</text><text x="952" y="201" class="sub">status + body JSON</text>
  </g>
  <path d="M42 270H1078" stroke="#30435f" stroke-width="1"/><text x="42" y="303" class="note"><tspan font-weight="700" fill="#f4c17b">400</tspan> input salah</text><text x="42" y="328" class="sub">200/201 berhasil  ·  404 ID tidak ditemukan  ·  500 query gagal</text>
</svg>
