<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Sampul panduan belajar backend restoran</title>
  <desc id="desc">Panduan belajar Rust, Actix, dan PostgreSQL. Ikuti alur dari request client melalui route dan handler hingga database, dengan tiga langkah belajar: pahami, telusuri, praktik.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09111f"/><stop offset="1" stop-color="#142239"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#50d3bd"/><stop offset="1" stop-color="#788cff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8296b5" stroke-opacity=".12"/></pattern>
    <clipPath id="canvas"><rect width="1200" height="540" rx="32"/></clipPath>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9z" fill="#8ba4c8"/></marker>
    <style>
      text{font-family:Inter,"Segoe UI",sans-serif}.eyebrow{font-size:14px;font-weight:700;letter-spacing:2.2px;fill:#8edfd1}.title{font-size:44px;font-weight:750;letter-spacing:-1.1px;fill:#f4f7ff}.lead{font-size:18px;fill:#b8c5d9}.card{fill:#121f32;stroke:#344762;stroke-width:1.4}.node{font-size:14px;font-weight:700;letter-spacing:.5px;fill:#eef3fc}.hint{font-size:12px;fill:#a9bad1}.pill{font-size:13px;font-weight:700;letter-spacing:.6px}
    </style>
  </defs>
  <rect width="1200" height="540" rx="32" fill="url(#bg)"/>
  <g clip-path="url(#canvas)"><rect width="1200" height="540" fill="url(#grid)" opacity=".34"/><circle cx="1080" cy="40" r="230" fill="#4b66a6" opacity=".11"/><circle cx="945" cy="480" r="180" fill="#33a899" opacity=".09"/></g>
  <rect x="66" y="68" width="30" height="4" rx="2" fill="url(#glow)"/>
  <text x="108" y="75" class="eyebrow">PANDUAN BELAJAR · RUST + ACTIX + POSTGRESQL</text>
  <text x="66" y="170" class="title">Backend restoran,</text><text x="66" y="228" class="title">dari request ke response.</text>
  <text x="69" y="278" class="lead">Ikuti alurnya. Pahami kodenya. Coba sendiri.</text>
  <g>
    <rect x="66" y="338" width="154" height="46" rx="23" fill="#15332f" stroke="#347f75"/><circle cx="90" cy="361" r="5" fill="#65d5c1"/><text x="108" y="366" class="pill" fill="#a6eee1">01 · PAHAMI</text>
    <rect x="232" y="338" width="166" height="46" rx="23" fill="#17253a" stroke="#405777"/><circle cx="256" cy="361" r="5" fill="#87a5d4"/><text x="274" y="366" class="pill" fill="#cfdbef">02 · TELUSURI</text>
    <rect x="410" y="338" width="154" height="46" rx="23" fill="#30251d" stroke="#926438"/><circle cx="434" cy="361" r="5" fill="#f2b86d"/><text x="452" y="366" class="pill" fill="#ffdaa6">03 · PRAKTIK</text>
  </g>
  <text x="68" y="461" font-family="Inter, sans-serif" font-size="14" fill="#91a3bd">14 bab  ·  diagram visual  ·  contoh API yang dapat dicoba</text>
  <g>
    <rect x="630" y="100" width="510" height="354" rx="26" fill="#0d1828" stroke="#2d405c" stroke-width="1.5"/>
    <text x="666" y="141" font-family="Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8" fill="#8298b9">JALUR SEBUAH REQUEST</text>
    <path d="M773 246H794M905 246H926M1037 246H1058" fill="none" stroke="#8198ba" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g text-anchor="middle">
      <rect x="660" y="198" width="112" height="96" rx="18" class="card"/><circle cx="716" cy="221" r="12" fill="#273a55"/><text x="716" y="225" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#dce7f8">01</text><text x="716" y="258" class="node">CLIENT</text><text x="716" y="278" class="hint">kirim request</text>
      <rect x="792" y="198" width="112" height="96" rx="18" fill="#17253a" stroke="#405777" stroke-width="1.4"/><circle cx="848" cy="221" r="12" fill="#2a3d59"/><text x="848" y="225" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#dce7f8">02</text><text x="848" y="258" class="node">ROUTE</text><text x="848" y="278" class="hint">pilih endpoint</text>
      <rect x="924" y="198" width="112" height="96" rx="18" fill="#142b2d" stroke="#347f75" stroke-width="1.4"/><circle cx="980" cy="221" r="12" fill="#1d4a47"/><text x="980" y="225" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#c7f3e9">03</text><text x="980" y="258" class="node">HANDLER</text><text x="980" y="278" class="hint">validasi + aturan</text>
      <rect x="1056" y="198" width="74" height="96" rx="18" fill="#28231f" stroke="#87633e" stroke-width="1.4"/><circle cx="1093" cy="221" r="12" fill="#4a3929"/><text x="1093" y="225" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#ffe0b6">04</text><text x="1093" y="257" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="#eef3fc">DB</text><text x="1093" y="278" class="hint">PostgreSQL</text>
    </g>
    <path d="M668 346H1102" stroke="url(#glow)" stroke-width="2" opacity=".65"/>
    <text x="885" y="382" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#c7d4e8">Pahami alurnya, lalu telusuri tiap modul</text>
  </g>
</svg>
